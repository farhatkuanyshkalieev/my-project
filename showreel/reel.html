  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};

window.ready = Promise.all([document.fonts.load('900 100px Geist'), document.fonts.load('500 20px Geist')]).then(() => { window.seek(0); return true; });
</script>
