<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FOLD Showreel</title>
<style>
@font-face{font-family:Geist;font-weight:900;src:url(data:font/woff2;base64,__GEIST_BLACK__) format('woff2')}
@font-face{font-family:Geist;font-weight:500;src:url(data:font/woff2;base64,__GEIST_MEDIUM__) format('woff2')}
html,body{margin:0;background:#0B0B0C;overflow:hidden}
canvas{display:block;width:1920px;height:1080px}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
/* FOLD — one vermilion square is folded, beat by beat, into type, form, space, data and its own name.
   120 BPM, 30 beats, 15 s. window.seek(t) draws frame t from scratch: no timers, no carried state. */
const GLYPHS = /*__GLYPHS__*/null;

// ───────────────────────────── core
const W = 1920, H = 1080, CX = W / 2, CY = H / 2, DUR = 15, SPB = 0.5;
const RGB = { k: [11, 11, 12], w: [243, 241, 236], v: [255, 74, 28], c: [45, 59, 255] };
const css = (a) => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const COL = { k: css(RGB.k), w: css(RGB.w), v: css(RGB.v), c: css(RGB.c) };
const mixc = (a, b, u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, u) => a + (b - a) * u;
const lerp2 = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];

// exponential ease-out, normalised so it lands exactly on 1
const expo = (k = 10) => (x) => (x <= 0 ? 0 : x >= 1 ? 1 : (1 - Math.pow(2, -k * x)) / (1 - Math.pow(2, -k)));
const eo = expo(10), eo7 = expo(7);
// damped spring step response (zeta ~0.8: settles with ~1-2% overshoot, never bouncy)
function spring(dt, w = 20, z = 0.8) {
  if (dt <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + ((z * w) / wd) * Math.sin(wd * dt));
}
const tw = (t, t0, d, f = eo) => f(clamp((t - t0) / d));

const cv = document.getElementById('c');
const X = cv.getContext('2d');
const BUF = {};
const buf = (name) => BUF[name] || (BUF[name] = Object.assign(document.createElement('canvas'), { width: W, height: H }));
function fresh(name) {
  const g = buf(name).getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.clearRect(0, 0, W, H);
  return g;
}

// ───────────────────────────── motion blur
// Directional blur that follows speed and direction: the layer is re-drawn at n instants
// across the shutter and averaged. n scales with the on-screen displacement.
const SHUTTER = 1 / 90;
const nFor = (px) => (px < 1.5 ? 1 : px < 10 ? 3 : px < 40 ? 5 : 15); // 255/n stays integral
function pxEst(fn, t) {
  const a = fn(t - SHUTTER / 2), b = fn(t + SHUTTER / 2);
  let m = 0;
  for (let i = 0; i < Math.min(a.length, b.length); i++) m = Math.max(m, Math.hypot(a[i][0] - b[i][0], a[i][1] - b[i][1]));
  return m;
}
function mblur(ctx, t, px, draw) {
  const n = nFor(px);
  if (n === 1) { draw(ctx, t); return; }
  const acc = fresh('acc');
  for (let i = 0; i < n; i++) {
    const l = fresh('lay');
    draw(l, t + SHUTTER * ((i + 0.5) / n - 0.5));
    acc.globalCompositeOperation = 'lighter';
    acc.globalAlpha = 1 / n;
    acc.drawImage(buf('lay'), 0, 0);
  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(buf('acc'), 0, 0);
  ctx.restore();
}

// ───────────────────────────── type (Geist Black outlines)
const P2 = {};
function gpath(ch) {
  if (P2[ch]) return P2[ch];
  const p = new Path2D();
  for (const c of GLYPHS.chars[ch].cmds) {
    if (c[0] === 'M') p.moveTo(c[1], c[2]);
    else if (c[0] === 'L') p.lineTo(c[1], c[2]);
    else if (c[0] === 'Q') p.quadraticCurveTo(c[1], c[2], c[3], c[4]);
    else if (c[0] === 'C') p.bezierCurveTo(c[1], c[2], c[3], c[4], c[5], c[6]);
    else p.closePath();
  }
  return (P2[ch] = p);
}
function glyph(ctx, ch, x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s / 1000, s / 1000);
  ctx.fill(gpath(ch));
  ctx.restore();
}
const inkU = (wd) => {
  const g = GLYPHS.words[wd], a = g[0], b = g[g.length - 1];
  return b[1] + GLYPHS.chars[b[0]].bb[2] - (a[1] + GLYPHS.chars[a[0]].bb[0]);
};
// lay out a word centred on its ink box, (cx, cy) = centre of the cap height
function lay(wd, s, cx, cy, track = 0) {
  const g = GLYPHS.words[wd], k = s / 1000;
  const L = (g[0][1] + GLYPHS.chars[g[0][0]].bb[0]) * k;
  const R = (g[g.length - 1][1] + GLYPHS.chars[g[g.length - 1][0]].bb[2]) * k + track * (g.length - 1);
  const ox = cx - (L + R) / 2, base = cy + (GLYPHS.cap * k) / 2;
  return g.map(([ch, x], i) => {
    const bb = GLYPHS.chars[ch].bb, lx = ox + x * k + track * i;
    return { ch, x: lx, y: base, s, ink: [lx + bb[0] * k, base + bb[1] * k, lx + bb[2] * k, base + bb[3] * k] };
  });
}
// left-aligned on ink at x, baseline y
function layL(wd, s, x, y) {
  const L = lay(wd, s, 0, 0), dx = x - L[0].ink[0], dy = y - L[0].y;
  return L.map((l) => ({ ...l, x: l.x + dx, y: l.y + dy, ink: [l.ink[0] + dx, l.ink[1] + dy, l.ink[2] + dx, l.ink[3] + dy] }));
}
const drawWord = (ctx, L) => L.forEach((l) => glyph(ctx, l.ch, l.x, l.y, l.s));

// ───────────────────────────── vector shapes for morphing
const N = 192;
function contours(ch, s, ox, oy) {
  const k = s / 1000, out = [];
  let cur = null, px = 0, py = 0;
  const P = (x, y) => [ox + x * k, oy + y * k];
  for (const c of GLYPHS.chars[ch].cmds) {
    if (c[0] === 'M') { cur = [P(c[1], c[2])]; out.push(cur); px = c[1]; py = c[2]; }
    else if (c[0] === 'L') { px = c[1]; py = c[2]; cur.push(P(px, py)); }
    else if (c[0] === 'Q') {
      for (let i = 1; i <= 10; i++) { const u = i / 10, a = (1 - u) * (1 - u), b = 2 * u * (1 - u), d = u * u; cur.push(P(a * px + b * c[1] + d * c[3], a * py + b * c[2] + d * c[4])); }
      px = c[3]; py = c[4];
    } else if (c[0] === 'C') {
      for (let i = 1; i <= 12; i++) { const u = i / 12, v = 1 - u; cur.push(P(v * v * v * px + 3 * v * v * u * c[1] + 3 * v * u * u * c[3] + u * u * u * c[5], v * v * v * py + 3 * v * v * u * c[2] + 3 * v * u * u * c[4] + u * u * u * c[6])); }
      px = c[5]; py = c[6];
    }
  }
  return out.filter((p) => p.length > 2);
}
function resample(pts, n = N) {
  const m = pts.length, cum = [0];
  let tot = 0;
  for (let i = 0; i < m; i++) { const a = pts[i], b = pts[(i + 1) % m]; tot += Math.hypot(b[0] - a[0], b[1] - a[1]); cum.push(tot); }
  const out = [];
  let j = 0;
  for (let i = 0; i < n; i++) {
    const tg = (tot * i) / n;
    while (j < m - 1 && cum[j + 1] < tg) j++;
    const a = pts[j], b = pts[(j + 1) % m], sl = cum[j + 1] - cum[j], u = sl > 0 ? (tg - cum[j]) / sl : 0;
    out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]);
  }
  return out;
}
const area = (p) => { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; };
const centroid = (p) => { let x = 0, y = 0; for (const q of p) { x += q[0]; y += q[1]; } return [x / p.length, y / p.length]; };
const bbox = (p) => { let a = [1e9, 1e9, -1e9, -1e9]; for (const q of p) a = [Math.min(a[0], q[0]), Math.min(a[1], q[1]), Math.max(a[2], q[0]), Math.max(a[3], q[1])]; return a; };
const shift = (p, dx, dy) => p.map((q) => [q[0] + dx, q[1] + dy]);
const lerpPts = (a, b, u) => a.map((q, i) => [q[0] + (b[i][0] - q[0]) * u, q[1] + (b[i][1] - q[1]) * u]);
// reorder pts so it best matches ref point-for-point (same winding, best cyclic offset)
function align(ref, pts) {
  let q = pts;
  const ar = area(ref), aq = area(q);
  if (Math.abs(ar) > 1e-3 && Math.abs(aq) > 1e-3 && Math.sign(ar) !== Math.sign(aq)) q = q.slice().reverse();
  const n = q.length;
  let best = 0, bd = Infinity;
  for (let s = 0; s < n; s++) {
    let d = 0;
    for (let i = 0; i < n; i += 3) { const a = ref[i], b = q[(i + s) % n]; d += (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2; }
    if (d < bd) { bd = d; best = s; }
  }
  return q.map((_, i) => q[(i + best) % n]);
}
const dot = (x = 0, y = 0) => Array.from({ length: N }, () => [x, y]);
const circ = (r, cx = 0, cy = 0, ry = r) => Array.from({ length: N }, (_, i) => { const a = -Math.PI / 2 + (2 * Math.PI * i) / N; return [cx + r * Math.cos(a), cy + ry * Math.sin(a)]; });
const sqr = (s) => resample([[0, -s / 2], [s / 2, -s / 2], [s / 2, s / 2], [-s / 2, s / 2], [-s / 2, -s / 2]]);
const tri = (s) => { const h = (s * Math.sqrt(3)) / 2; return resample([[0, -h / 2], [s / 2, h / 2], [-s / 2, h / 2]]); };
const halfDisc = (r) => { const v = []; for (let i = 0; i <= 64; i++) { const a = Math.PI + (Math.PI * i) / 64; v.push([r * Math.cos(a), r / 2 + r * Math.sin(a)]); } return resample(v); };
const diamond = (d) => resample([[0, -d], [d, 0], [0, d], [-d, 0]]);
function rrPoly(x0, y0, x1, y1, r) {
  const v = [[(x0 + x1) / 2, y0]];
  const arc = (cx, cy, a0) => { for (let i = 0; i <= 10; i++) { const a = a0 + (Math.PI / 2) * (i / 10); v.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } };
  arc(x1 - r, y0 + r, -Math.PI / 2); arc(x1 - r, y1 - r, 0); arc(x0 + r, y1 - r, Math.PI / 2); arc(x0 + r, y0 + r, Math.PI);
  return resample(v);
}
function fillShape(ctx, o, h, col) {
  ctx.beginPath();
  ctx.moveTo(o[0][0], o[0][1]);
  for (let i = 1; i < o.length; i++) ctx.lineTo(o[i][0], o[i][1]);
  ctx.closePath();
  if (h) { ctx.moveTo(h[0][0], h[0][1]); for (let i = 1; i < h.length; i++) ctx.lineTo(h[i][0], h[i][1]); ctx.closePath(); }
  ctx.fillStyle = col;
  ctx.fill('evenodd');
}
function letterShape(l) {
  const cs = contours(l.ch, l.s, l.x, l.y).sort((a, b) => Math.abs(area(b)) - Math.abs(area(a)));
  const o = resample(cs[0]), bb = bbox(o), c = [(bb[0] + bb[2]) / 2, (bb[1] + bb[3]) / 2];
  return { c, o: shift(o, -c[0], -c[1]), h: cs[1] ? shift(resample(cs[1]), -c[0], -c[1]) : dot(), hole: cs[1] ? resample(cs[1]) : null };
}

// ───────────────────────────── page-fold (true perspective flap, drawn in strips)
// A = frame before, B = frame after. horizontal axis at CY (side -1: top flap falls down, +1: bottom flap rises)
// vertical axis at CX (side -1: left flap swings right, +1: right flap swings left)
const FOCAL = 2300, STRIPS = 96;
function fold(ctx, A, B, p, vertical, side) {
  const th = Math.PI * p, c = Math.cos(th), s = Math.sin(th);
  const half = vertical ? W / 2 : H / 2, span = vertical ? H : W, mid = vertical ? CY : CX;
  const part = (img, from, to) => {
    if (vertical) ctx.drawImage(img, from, 0, to - from, H, from, 0, to - from, H);
    else ctx.drawImage(img, 0, from, W, to - from, 0, from, W, to - from);
  };
  const flapSide = side < 0 ? [0, half] : [half, 2 * half];
  const restSide = side < 0 ? [half, 2 * half] : [0, half];
  part(B, flapSide[0], flapSide[1]);
  part(A, restSide[0], restSide[1]);
  if (p >= 1) { part(B, restSide[0], restSide[1]); return; }
  const front = th < Math.PI / 2, src = front ? A : B, sh = half / STRIPS;
  const edge = [];
  for (let k = 0; k < STRIPS; k++) {
    const d0 = k * sh, d1 = (k + 1) * sh;
    const sc0 = FOCAL / (FOCAL - d0 * s), sc1 = FOCAL / (FOCAL - d1 * s), scm = (sc0 + sc1) / 2;
    // the flap's front carries A's flap-side half; its back carries B's opposite half
    const srcFrom = front === (side < 0) ? half - d1 : half + d0;
    const a0 = half + side * d0 * c * sc0, a1 = half + side * d1 * c * sc1;
    const lo = Math.min(a0, a1), len = Math.abs(a1 - a0) + 0.8;
    const ds = span * scm, dpos = mid - ds / 2;
    if (vertical) ctx.drawImage(src, srcFrom, 0, sh, H, lo, dpos, len, ds);
    else ctx.drawImage(src, 0, srcFrom, W, sh, dpos, lo, ds, len);
    if (k === 0) edge.push([half, mid - span / 2 * sc0], [half, mid + span / 2 * sc0]);
    if (k === STRIPS - 1) edge.push([a1, mid + span / 2 * sc1], [a1, mid - span / 2 * sc1]);
  }
  // flat paper shading on the flap
  ctx.beginPath();
  edge.forEach(([a, b], i) => { const x = vertical ? a : b, y = vertical ? b : a; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath();
  ctx.fillStyle = `rgba(0,0,0,${0.38 * s})`;
  ctx.fill();
}
const foldEdge = (p, vertical, side) => {
  const th = Math.PI * p, half = vertical ? W / 2 : H / 2, sc = FOCAL / (FOCAL - half * Math.sin(th));
  const a = half + side * half * Math.cos(th) * sc, b = (vertical ? H : W) / 2 * sc;
  return vertical ? [[a, CY - b], [a, CY + b]] : [[CX - b, a], [CX + b, a]];
};

// ═════════════════════════════ A · KINETIC TYPE (beats 1–6, 0–3 s; beats 1–4 are the hook)
const BW = 1400, BHt = 440, SB = 400;
const L_FOLD = lay('FOLD', SB, CX, CY), L_ONE = lay('ONE', SB, CX, CY);
const L_SHAPE = lay('SHAPE', Math.min(SB, (1250 / inkU('SHAPE')) * 1000), CX, CY);
const L_INTO = lay('INTO', SB, CX, CY);
const L_ANY = lay('ANY', 790, CX, CY);
const L_FORM = lay('FORM', 430, CX, CY);
const FORM_COL = [COL.v, COL.c, COL.w, COL.w];

// the counter of the A — the camera pushes through it
const A_HOLE = (() => {
  const l = L_ANY[0];
  const cs = contours('A', l.s, l.x, l.y).sort((a, b) => Math.abs(area(b)) - Math.abs(area(a)));
  const hole = resample(cs[1]), c = centroid(hole);
  const inside = (x, y) => { let r = false; for (let i = 0, j = hole.length - 1; i < hole.length; j = i++) { const a = hole[i], b = hole[j]; if ((a[1] > y) !== (b[1] > y) && x < ((b[0] - a[0]) * (y - a[1])) / (b[1] - a[1]) + a[0]) r = !r; } return r; };
  let K = 4;
  while (K < 400 && ![[-1, -1], [1, -1], [1, 1], [-1, 1]].every(([sx, sy]) => inside(c[0] + (sx * CX) / K, c[1] + (sy * CY) / K))) K *= 1.04;
  return { c, K: K * 1.15 };
})();

const bandMask = (c) => { c.beginPath(); c.rect(CX - BW / 2, CY - BHt / 2, BW, BHt); c.clip(); };
function band(c, w, h, col, L, reveal = 1) {
  c.fillStyle = col;
  c.fillRect(CX - w / 2, CY - h / 2, w, h);
  c.save();
  c.beginPath();
  const rv = Math.min(h, BHt * reveal);
  c.rect(CX - w / 2, CY - rv / 2, w, rv);
  c.clip();
  c.fillStyle = COL.k;
  drawWord(c, L);
  c.restore();
}

function typeLayer(c, t) {
  if (t < 0.5) { // 1 · square springs open into a band; FOLD is cut out of it
    const t0 = t - 0.012; // starts just after frame 0's shutter so the loop frame is a clean, still square
    const a = spring(t0, 17, 0.82), b = spring(t0 - 0.05, 17, 0.82);
    band(c, lerp(140, BW, a), lerp(140, BHt, b), COL.v, L_FOLD, spring(t0 - 0.1, 16, 0.85));
  } else if (t < 1.0) { // 2 · split-flap fold → ONE on cobalt
    const A = fresh('sA'), B = fresh('sB');
    band(A, BW, BHt, COL.v, L_FOLD);
    band(B, BW, BHt, COL.c, L_ONE);
    fold(c, buf('sA'), buf('sB'), tw(t, 0.5, 0.42, eo7), false, -1);
  } else if (t < 1.5) { // 3 · slot roll: the band rises out, SHAPE rolls up letter by letter
    c.save(); bandMask(c);
    const e = tw(t, 1.0, 0.36);
    c.translate(0, -BHt * 1.03 * e); band(c, BW, BHt, COL.c, L_ONE); c.translate(0, BHt * 1.03 * e);
    c.fillStyle = COL.w;
    L_SHAPE.forEach((l, j) => glyph(c, l.ch, l.x, l.y + BHt * 1.05 * (1 - tw(t, 1.0 + 0.035 * j, 0.42)), l.s));
    c.restore();
  } else if (t < 2.0) { // 4 · SHAPE drops away, INTO snaps in from wide tracking
    c.save(); bandMask(c); c.fillStyle = COL.w;
    L_SHAPE.forEach((l, j) => glyph(c, l.ch, l.x, l.y + BHt * 1.05 * tw(t, 1.5 + 0.02 * j, 0.3), l.s));
    const e = tw(t, 1.5, 0.45);
    L_INTO.forEach((l, j) => glyph(c, l.ch, l.x + (j - 1.5) * 1500 * (1 - e), l.y, l.s));
    c.restore();
  } else if (t < 2.5) { // 5 · the stack scrolls: INTO falls, ANY drops in at full height
    c.fillStyle = COL.w;
    const e = tw(t, 2.0, 0.36, eo7);
    L_INTO.forEach((l) => glyph(c, l.ch, l.x, l.y + 1150 * e, l.s));
    L_ANY.forEach((l, j) => glyph(c, l.ch, l.x, l.y - 1150 * (1 - tw(t, 2.0 + 0.045 * j, 0.42)), l.s));
  } else { // 6 · push through the counter of the A; FORM is waiting inside
    const e = tw(t, 2.5, 0.46, expo(8)), P = A_HOLE.c, s = Math.exp(Math.log(A_HOLE.K) * e);
    c.save();
    c.setTransform(s, 0, 0, s, lerp(P[0], CX, e) - P[0] * s, lerp(P[1], CY, e) - P[1] * s);
    c.fillStyle = COL.w;
    drawWord(c, L_ANY);
    c.translate(P[0], P[1]); c.scale(1 / A_HOLE.K, 1 / A_HOLE.K); c.translate(-CX, -CY);
    L_FORM.forEach((l, i) => { c.fillStyle = FORM_COL[i]; glyph(c, l.ch, l.x, l.y, l.s); });
    c.restore();
  }
}
function typePts(t) {
  if (t < 0.5) { const a = spring(t - 0.012, 17, 0.82); return [[CX + lerp(70, BW / 2, a), CY]]; }
  if (t < 1.0) return foldEdge(tw(t, 0.5, 0.42, eo7), false, -1);
  if (t < 1.5) return L_SHAPE.map((l, j) => [0, BHt * (1 - tw(t, 1.0 + 0.035 * j, 0.42))]).concat([[0, BHt * tw(t, 1.0, 0.36)]]);
  if (t < 2.0) return [[1500 * 1.5 * (1 - tw(t, 1.5, 0.45)), 0], [0, BHt * tw(t, 1.5, 0.3)]];
  if (t < 2.5) return L_ANY.map((l, j) => [0, 1150 * tw(t, 2.0 + 0.045 * j, 0.42)]).concat([[0, 1150 * tw(t, 2.0, 0.36, eo7)]]);
  const e = tw(t, 2.5, 0.46, expo(8));
  return [[Math.log(A_HOLE.K) * e * 1100, 0]];
}

// ═════════════════════════════ B · SHAPE MORPH (beats 7–12, 3–6 s)
const SLOT = (j) => CX + (j - 1.5) * 330;
const ROW = (j) => CX + (j - 1.5) * 283;
const QUAD = [[-100, -100], [-100, 100], [100, -100], [100, 100]]; // row position → quadrant
const PRIM = [sqr(220), circ(128), tri(276), halfDisc(150)];
const RADII = [96, 138, 112, 150];
const OBJ = L_FORM.map((l, i) => {
  const ls = letterShape(l), j = (i + 1) % 4;
  const K0 = { o: ls.o, h: ls.h, x: ls.c[0], y: ls.c[1], r: 0 };

// ═════════════════════════════ timeline
const SECTIONS = [

window.seek = function (t) {

  X.setTransform(1, 0, 0, 1, 0, 0);
  X.globalAlpha = 1;
  X.globalCompositeOperation = 'source-over';
  X.fillStyle = COL.k;

// ═════════════════════════════ soundtrack (Web Audio, OfflineAudioContext)
window.renderAudio = async function () {

    env(a, t, 0.002, g, 0.42);
    o.connect(a).connect(master); o.start(t); o.stop(t + 0.5);
    const n = noise(t, 0.03), f = ac.createBiquadFilter(), ng = ac.createGain();
    f.type = 'highpass'; f.frequency.value = 2500; env(ng, t, 0.001, 0.22 * g, 0.018);

  }
  function hat(t, g = 0.09, open = false) {
    const n = noise(t, 0.2), f = ac.createBiquadFilter(), a = ac.createGain();
    f.type = 'highpass'; f.frequency.value = 8000; env(a, t, 0.001, g, open ? 0.14 : 0.035);
    n.connect(f).connect(a).connect(pan(open ? 0.25 : -0.2)).connect(master);
  }
  function clap(t, g = 0.35) {

      const n = noise(t + k * 0.011, 0.25), f = ac.createBiquadFilter(), a = ac.createGain();
      f.type = 'bandpass'; f.frequency.value = 1600; f.Q.value = 1.2; env(a, t + k * 0.011, 0.001, g * (k === 2 ? 1 : 0.6), k === 2 ? 0.16 : 0.012);

    env(a, t, 0.003, 0.9 * g, 1.1); o.connect(a).connect(master); o.start(t); o.stop(t + 1.3);
    const n = noise(t, 0.9), f = ac.createBiquadFilter(), ng = ac.createGain();
