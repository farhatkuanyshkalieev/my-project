<!doctype html>
<html><head><meta charset="utf-8"><title>lying preview</title>
<style>html,body{margin:0;width:1080px;height:700px;background:linear-gradient(#fff,#F3FCFB)}</style></head>
<body>
<svg width="1080" height="700" viewBox="0 0 1080 700"><g id="g"></g></svg>
<script>
function smooth(pts, closed = true) {
  const n = pts.length; let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  const P = i => pts[closed ? (i + n) % n : Math.min(Math.max(i, 0), n - 1)];
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d + (closed ? 'Z' : '');
}
</script>
<script src="lying.js"></script>
<script>drawLying(document.getElementById('g'), 120, 380, 1.0, 0.2);</script>
</body></html>
