<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Переписка с килограммами</title>
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
  :root { --turq:#3CE0D7; --turq-d:#1EBBB0; --turq-dd:#128C84; --g:#373435; --grey:#8A9196; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: 'Montserrat', 'Noto Color Emoji', sans-serif; color: var(--g);
         background: linear-gradient(#FFFFFF, #E3F8F5); }
  .abs { position: absolute; }
  #bgc circle { transition: none; }
  #logo { position: absolute; left: 50%; top: 52px; width: 430px; transform: translateX(-50%); }
  #phone { position: absolute; left: 60px; right: 60px; top: 250px; height: 1560px; border-radius: 60px; background: #fff;
           box-shadow: 0 40px 90px rgba(18,140,132,.18), 0 8px 24px rgba(18,140,132,.10); overflow: hidden; }
  #head { position: absolute; left: 0; right: 0; top: 0; height: 170px; display: flex; align-items: center; gap: 26px; padding: 0 44px;
          border-bottom: 2px solid #E7F2F1; background: #fff; z-index: 3; }
  #ava { width: 104px; height: 104px; border-radius: 50%; background: linear-gradient(135deg,#FFE3D6,#FFC9B5);
         display: flex; align-items: center; justify-content: center; font-size: 58px; }
  #name { font-weight: 800; font-size: 46px; }
  #status { font-weight: 500; font-size: 30px; color: var(--turq-d); margin-top: 4px; }
  #area { position: absolute; left: 0; right: 0; top: 170px; bottom: 0; background: #F2F8F8; overflow: hidden; }
  #feed { position: absolute; left: 0; right: 0; top: 0; padding: 40px 40px 60px; display: flex; flex-direction: column; gap: 22px; }
  .b { max-width: 78%; padding: 26px 34px; border-radius: 40px; font-weight: 600; font-size: 46px; line-height: 1.25;
       transform-origin: left bottom; opacity: 0; }
  .in  { align-self: flex-start; background: #fff; border-bottom-left-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,.05); }
  .out { align-self: flex-end; background: linear-gradient(135deg,#3CE0D7,#1EBBB0); color: #fff; border-bottom-right-radius: 12px; transform-origin: right bottom; }
  .big { font-size: 96px; font-weight: 900; letter-spacing: .02em; }
  .emo { vertical-align: -0.2em; }
  .time { display: block; font-size: 24px; font-weight: 500; opacity: .6; margin-top: 6px; text-align: right; }
  .typing { align-self: flex-start; background: #fff; border-radius: 40px; border-bottom-left-radius: 12px; padding: 30px 38px;
            display: flex; gap: 14px; opacity: 0; }
  .typing i { width: 18px; height: 18px; border-radius: 50%; background: #B9C3C6; display: block; }
  .sys { align-self: center; background: rgba(55,52,53,.82); color: #fff; font-weight: 600; font-size: 34px; padding: 20px 34px;
         border-radius: 30px; opacity: 0; transform-origin: center; }
  #end { position: absolute; inset: 0; opacity: 0; background: linear-gradient(#FFFFFF, #DDF6F3); }
  #end .c { position: absolute; left: 0; right: 0; text-align: center; }
  .btn { position: absolute; left: 110px; right: 110px; height: 170px; border-radius: 85px;
         background: linear-gradient(90deg, #3CE0D7, #1EBBB0); color: #fff; display: flex; flex-direction: column;
         align-items: center; justify-content: center; box-shadow: 0 24px 50px rgba(30,187,176,.35); }
  .btn b { font-weight: 900; font-size: 60px; } .btn small { font-weight: 800; font-size: 46px; letter-spacing: .02em; }
</style>
</head>
<body>
<svg id="bgc" class="abs" width="1080" height="1920" style="left:0;top:0">
  <circle id="c1" cx="1080" cy="1600" r="560" fill="#3CE0D7" opacity=".12"/>
  <circle id="c2" cx="-60" cy="420" r="300" fill="#3CE0D7" opacity=".10"/>
</svg>
<img id="logo" src="../../brand/logo.png" alt="">

<div id="phone">
  <div id="head">
    <div id="ava"><img class="emo" src="emoji/2696-fe0f.png" style="height:64px" alt=""></div>
    <div><div id="name">Мои килограммы</div><div id="status">в сети</div></div>
  </div>
  <div id="area"><div id="feed"></div></div>
</div>

<div id="end">
  <img src="../../brand/logo.png" alt="" style="position:absolute;left:50%;top:230px;width:640px;transform:translateX(-50%)">
  <div class="c" id="e1" style="top:640px"><div style="font-weight:700;font-size:34px;letter-spacing:.22em;color:#1EBBB0">ЛЕНИВЫЙ СПОРТ</div></div>
  <div class="c" id="e2" style="top:710px"><div style="font-weight:900;font-size:110px;line-height:1.05">Килограммы<br>заблокированы</div></div>
  <div class="c" id="e3" style="top:980px"><div style="font-weight:500;font-size:44px;color:#6B7079">45 минут на аппаратах — без нагрузки</div></div>
  <div class="btn" id="e4" style="top:1170px"><b>Оставьте заявку</b><small>8 707 474 78 24</small></div>
  <div class="c" id="e5" style="top:1700px"><div style="font-weight:600;font-size:32px;color:#6B7079">Алматы · Аксай-1, 10/3 · Аль-Фараби, 83</div></div>
</div>

<script>
const DUR = 16.0, T_END = 12.6;
const MSGS = [
  { t: 0.9, side: 'in',  text: 'ты где? <img class="emo" src="emoji/1f97a.png" style="height:1.08em" alt="">' },
  { t: 2.0, side: 'in',  text: 'почему не отвечаешь' },
  { t: 3.1, side: 'in',  text: 'мы же вместе с 2019 года <img class="emo" src="emoji/1f494.png" style="height:1.08em" alt="">' },
  { t: 4.4, side: 'out', text: 'я на аппаратах у Аллы Казаниной' },
  { t: 5.5, side: 'out', text: 'не пиши мне больше' },
  { t: 6.8, side: 'in',  text: 'стоп. ты похудела на 3 см?!' },
  { t: 7.9, side: 'in',  text: 'на 7?!' },
  { t: 8.8, side: 'in',  text: 'ПОДОЖДИ', big: true },
  { t: 10.0, side: 'out', text: '45 минут лежу — а ты уходишь сам <img class="emo" src="emoji/1f60c.png" style="height:1.08em" alt="">' },
  { t: 11.3, side: 'sys', text: '<img class="emo" src="emoji/1f512.png" style="height:1.08em" alt=""> Вы заблокировали «Мои килограммы»' },
];
const clamp = x => Math.min(Math.max(x, 0), 1);
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const eo = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = id => document.getElementById(id);

// build feed: a typing indicator before every incoming message
const feed = $('feed'); const items = [];
MSGS.forEach((m, i) => {
  if (m.side === 'in') {
    const ty = document.createElement('div'); ty.className = 'typing'; ty.innerHTML = '<i></i><i></i><i></i>';
    feed.appendChild(ty); items.push({ el: ty, kind: 'typing', t0: m.t - 0.55, t1: m.t });
  }
  const el = document.createElement('div');
  el.className = m.side === 'sys' ? 'sys' : 'b ' + m.side + (m.big ? ' big' : '');
  el.innerHTML = m.text + (m.side !== 'sys' ? `<span class="time">${m.side === 'out' ? '21:4' + (i % 10) + ' ✓✓' : '21:4' + (i % 10)}</span>` : '');
  feed.appendChild(el); items.push({ el, kind: m.side, t0: m.t, big: m.big });
});

window.render = function (t) {
  // background drift
  $('c1').setAttribute('transform', `translate(${Math.sin(t * .4) * 24} ${Math.cos(t * .35) * 20})`);
  $('c2').setAttribute('transform', `translate(${Math.cos(t * .5) * 20} ${Math.sin(t * .45) * 18})`);
  // phone enters
  const pe = eo(t / 0.5);
  $('phone').style.transform = `translateY(${(1 - pe) * 120}px)`;
  $('phone').style.opacity = ease(t / 0.35);
  // items
  items.forEach(it => {
    const el = it.el;
    if (it.kind === 'typing') {
      const vis = t >= it.t0 && t < it.t1;
      el.style.display = vis ? 'flex' : 'none';
      el.style.opacity = vis ? 1 : 0;
      if (vis) [...el.children].forEach((d, k) => { d.style.transform = `translateY(${-10 * Math.max(0, Math.sin((t * 9) - k * .9))}px)`; });
      return;
    }
    const lt = t - it.t0;
    el.style.display = lt >= 0 ? '' : 'none';
    if (lt < 0) return;
    const s = it.kind === 'sys' ? 0.8 + 0.2 * eo(lt / 0.3) : 0.55 + 0.45 * back(lt / 0.32);
    el.style.opacity = ease(lt / 0.18);
    el.style.transform = `scale(${s})`;
  });
  // keep the newest message in view (feed scrolls up)
  const area = $('area').clientHeight;
  const h = feed.scrollHeight;
  const target = Math.min(0, area - h);
  window.__scroll = (window.__scroll === undefined || t < 0.05) ? target : window.__scroll + (target - window.__scroll) * 0.32;
  $('feed').style.transform = `translateY(${window.__scroll}px)`;
  // shake on «ПОДОЖДИ»
  const sk = t - 8.8;
  const shake = sk > 0 && sk < 0.5 ? Math.sin(sk * 70) * 16 * (1 - sk / 0.5) : 0;
  // status and block
  $('status').textContent = t >= 11.3 ? 'заблокирован' : (items.some(i => i.kind === 'typing' && t >= i.t0 && t < i.t1) ? 'печатает…' : 'в сети');
  $('status').style.color = t >= 11.3 ? '#E2574C' : '#1EBBB0';
  const dim = ease((t - 11.6) / 0.6);
  $('phone').style.filter = `saturate(${1 - .5 * dim})`;
  $('phone').style.transform += ` translateX(${shake}px)`;
  // end card
  const ea = ease((t - T_END) / 0.4);
  $('end').style.opacity = ea;
  ['e1', 'e2', 'e3', 'e4', 'e5'].forEach((id, k) => {
    const x = (t - T_END - 0.15 - k * 0.22) / 0.4;
    $(id).style.opacity = ease(x);
    $(id).style.transform = `translateY(${(1 - eo(x)) * 40}px)` + (id === 'e4' ? ` scale(${1 + .025 * Math.sin(t * 6)})` : '');
  });
};
window.render(0);
</script>
</body>
</html>
