<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Останови видео</title>
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
  :root { --turq:#3CE0D7; --turq-d:#1EBBB0; --g:#373435; --grey:#6B7079; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: 'Montserrat', sans-serif; color: var(--g); background: linear-gradient(#FFFFFF, #E3F8F5); }
  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .c { position: absolute; left: 0; right: 0; text-align: center; }
  .emo { vertical-align: -0.18em; }
  #logo { position: absolute; left: 50%; top: 52px; width: 430px; transform: translateX(-50%); z-index: 5; }
  .h1 { font-weight: 900; font-size: 100px; line-height: 1.06; }
  .h1 b { color: var(--turq-d); }
  .sub { font-weight: 600; font-size: 46px; color: var(--grey); }
  #card { position: absolute; left: 110px; right: 110px; top: 520px; height: 960px; border-radius: 70px;
          box-shadow: 0 40px 90px rgba(18,140,132,.22); overflow: hidden; }
  #card .em { position: absolute; left: 50%; top: 150px; width: 300px; height: 300px; transform: translateX(-50%); }
  #card .nm { position: absolute; left: 40px; right: 40px; top: 520px; text-align: center; font-weight: 900; font-size: 82px; line-height: 1.05; color: #fff; }
  #card .ds { position: absolute; left: 40px; right: 40px; top: 760px; text-align: center; font-weight: 600; font-size: 44px; color: rgba(255,255,255,.95); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .stopbar { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-weight: 900; font-size: 58px; color: #E2574C; letter-spacing: .04em; }
  .btn { position: absolute; left: 110px; right: 110px; height: 170px; border-radius: 85px;
         background: linear-gradient(90deg, #3CE0D7, #1EBBB0); color: #fff; display: flex; flex-direction: column;
         align-items: center; justify-content: center; box-shadow: 0 24px 50px rgba(30,187,176,.35); }
  .btn b { font-weight: 900; font-size: 60px; } .btn small { font-weight: 800; font-size: 46px; letter-spacing: .02em; }
</style>
</head>
<body>
<svg class="abs" width="1080" height="1920" style="left:0;top:0">
  <circle id="c1" cx="1080" cy="1600" r="560" fill="#3CE0D7" opacity=".12"/>
  <circle id="c2" cx="-60" cy="420" r="300" fill="#3CE0D7" opacity=".10"/>
</svg>
<img id="logo" src="../../brand/logo.png" alt="">

<!-- 0: hook -->
<div class="scene" id="s0">
  <div class="c" id="h0a" style="top:420px"><img src="emoji160/1f6d1.png" style="width:260px"></div>
  <div class="c" id="h0b" style="top:760px"><div class="h1">Останови<br>видео</div></div>
  <div class="c" id="h0c" style="top:1020px"><div class="sub" style="font-size:54px;color:#373435;font-weight:700">и узнай свою процедуру<br>на эту неделю</div></div>
  <div class="c" id="h0d" style="top:1320px"><img src="emoji160/1f447.png" style="width:150px"></div>
</div>

<!-- 1: cycling cards -->
<div class="scene" id="s1">
  <div class="stopbar" id="stopbar">ЖМИ ПАУЗУ!</div>
  <div id="card"><img class="em" id="cem" src=""><div class="nm" id="cnm"></div><div class="ds" id="cds"></div></div>
</div>

<!-- 2: comments -->
<div class="scene" id="s2">
  <div class="c" style="top:520px"><img src="emoji160/1f914.png" style="width:240px"></div>
  <div class="c" id="t2" style="top:820px"><div class="h1">Что выпало?</div></div>
  <div class="c" id="t2b" style="top:960px"><div class="sub" style="font-size:56px;color:#373435;font-weight:700">Напиши в комментариях</div></div>
  <div class="c" id="t2c" style="top:1110px"><img src="emoji160/1f447.png" style="width:130px"></div>
</div>

<!-- 3: end -->
<div class="scene" id="s3">
  <img src="../../brand/logo.png" alt="" style="position:absolute;left:50%;top:260px;width:620px;transform:translateX(-50%)">
  <div class="c" id="e2" style="top:700px"><div class="h1" style="font-size:88px">Запишитесь<br>на свою процедуру</div></div>
  <div class="c" id="e3" style="top:960px"><div class="sub" style="font-size:44px">подберём программу под вас</div></div>
  <div class="btn" id="e4" style="top:1150px"><b>Оставьте заявку</b><small>8 707 474 78 24</small></div>
  <div class="c" id="e5" style="top:1660px"><div style="font-weight:600;font-size:32px;color:#6B7079">Алматы · Аксай-1, 10/3 · Аль-Фараби, 83</div></div>
</div>
<div id="flash"></div>

<script>
// scene times follow vo.mp3 pieces (see audio.py)
const T = { cards: 4.8, ask: 11.8, end: 14.6 }, DUR = 18.0, STEP = 0.2;
const CARDS = [
  { e: '1f9d8-200d-2640-fe0f', n: 'Ленивый спорт', d: 'ты лежишь — мышцы работают', bg: ['#3CE0D7', '#1EBBB0'] },
  { e: '2728', n: 'NEO PLASMA', d: 'сияющая кожа к празднику', bg: ['#B48CF2', '#7F5BD6'] },
  { e: '1f486-200d-2640-fe0f', n: 'RF-лифтинг', d: 'подтянутый контур лица', bg: ['#F59AA3', '#E25C6A'] },
  { e: '1f3d6-fe0f', n: 'Тебе нужен отпуск', d: 'но процедуры тоже можно', bg: ['#FFCF6B', '#F2A23A'], joke: true },
  { e: '1f4a7', n: 'Лимфодренаж', d: 'минус отёки, плюс лёгкость', bg: ['#6FC3F7', '#3A8FE0'] },
  { e: '1f525', n: 'Лазерный липолиз', d: 'точечно по проблемным зонам', bg: ['#FF9A6B', '#F06A3A'] },
  { e: '1f300', n: 'Вакуумный массаж', d: 'тонус и гладкость кожи', bg: ['#5FD7B5', '#21A985'] },
  { e: '1f60b', n: 'Баурсак разрешён', d: 'сегодня можно, завтра — в центр', bg: ['#E8B07A', '#C47A3A'], joke: true },
];
const clamp = x => Math.min(Math.max(x, 0), 1);
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const eo = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = id => document.getElementById(id);
function alpha(t, a, b) { return t < a || t >= b + .25 ? 0 : (t < b ? ease((t - a) / .25) : 1 - ease((t - b) / .25)); }
function rise(id, lt) { $(id).style.opacity = ease(lt / .3); $(id).style.transform = `translateY(${(1 - eo(lt / .45)) * 44}px)`; }
let lastIdx = -1;

window.render = function (t) {
  $('c1').setAttribute('transform', `translate(${Math.sin(t * .4) * 24} ${Math.cos(t * .35) * 20})`);
  $('c2').setAttribute('transform', `translate(${Math.cos(t * .5) * 20} ${Math.sin(t * .45) * 18})`);
  // hook
  $('s0').style.opacity = alpha(t, 0, T.cards);
  $('h0a').style.transform = `scale(${back(t / .45)}) rotate(${Math.sin(t * 6) * 4}deg)`;
  rise('h0b', t - .3); rise('h0c', t - .7);
  $('h0d').style.opacity = ease((t - 1.2) / .3);
  $('h0d').style.transform = `translateY(${Math.abs(Math.sin(t * 5)) * 30}px)`;
  // cards: a new card every STEP seconds; each card drops in with a tiny bounce
  const l1 = t - T.cards;
  $('s1').style.opacity = alpha(t, T.cards, T.ask);
  if (l1 >= 0 && t < T.ask + .3) {
    const i = Math.floor(l1 / STEP) % CARDS.length, k = (l1 % STEP) / STEP;
    if (i !== lastIdx) {
      const c = CARDS[i]; lastIdx = i;
      $('card').style.background = `linear-gradient(160deg, ${c.bg[0]}, ${c.bg[1]})`;
      $('cem').src = 'emoji160/' + c.e + '.png'; $('cnm').textContent = c.n; $('cds').textContent = c.d;
    }
    const s = 0.92 + 0.08 * back(k / .6);
    $('card').style.transform = `scale(${s}) rotate(${(i % 2 ? 1 : -1) * (1 - eo(k / .5)) * 3}deg)`;
    $('cem').style.transform = `translateX(-50%) scale(${0.8 + 0.2 * back(k / .6)})`;
    $('stopbar').style.opacity = 0.55 + 0.45 * Math.abs(Math.sin(t * 6));
  }
  // flash when the cycling stops
  $('flash').style.opacity = t > T.ask && t < T.ask + .3 ? .7 * (1 - (t - T.ask) / .3) : 0;
  // ask
  const l2 = t - T.ask;
  $('s2').style.opacity = alpha(t, T.ask, T.end);
  rise('t2', l2 - .1); rise('t2b', l2 - .4);
  $('t2c').style.opacity = ease((l2 - .7) / .3);
  $('t2c').style.transform = `translateY(${Math.abs(Math.sin(t * 5)) * 26}px)`;
  // end
  const l3 = t - T.end;
  $('s3').style.opacity = ease(l3 / .35);
  $('logo').style.opacity = 1 - ease(l3 / .35);
  ['e2', 'e3', 'e4', 'e5'].forEach((id, k) => {
    const x = (l3 - .15 - k * .2) / .4;
    $(id).style.opacity = ease(x);
    $(id).style.transform = `translateY(${(1 - eo(x)) * 40}px)` + (id === 'e4' ? ` scale(${1 + .025 * Math.sin(t * 6)})` : '');
  });
};
window.render(0);
</script>
</body>
</html>
