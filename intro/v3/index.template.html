<meta charset="utf-8">
<title>THERMINAL Intro v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: the 9:16 player beside a compact shot list; the stage itself keeps fixed video colours */
:root{--paper:#f4f4f1;--sheet:#fff;--ink:#171717;--ink-2:#55585c;--rule:#d9d9d4;--red:#c81111;
  --f-display:'Montserrat',Arial,sans-serif;--f-body:'IBM Plex Sans',Arial,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#121314;--sheet:#1b1c1e;--ink:#ececea;--ink-2:#a3a6aa;--rule:#33353a;--red:#ef3b3b;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121314;--sheet:#1b1c1e;--ink:#ececea;--ink-2:#a3a6aa;--rule:#33353a;--red:#ef3b3b;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:40px;align-items:start}
h1{font-family:var(--f-display);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:26px;margin:0}
.player{display:flex;flex-direction:column;gap:10px}
.screen{position:relative;width:100%;aspect-ratio:9/16;overflow:hidden;background:#000;border-radius:6px;box-shadow:0 0 0 1px var(--rule)}
.screen.full{position:fixed;left:0;top:0;width:1080px;height:1920px;border-radius:0;box-shadow:none}
body.render{padding:0;background:#000}
.stage{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;overflow:hidden;font-family:var(--f-display)}
.ctrl{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center}
.ctrl button{font-family:var(--f-mono);font-size:12px;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:6px 10px;cursor:pointer}
.ctrl button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--red)}
.mono{font-family:var(--f-mono);font-size:12px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.side p{margin:0;max-width:62ch;color:var(--ink-2)}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}.player{max-width:380px;margin:0 auto;width:100%}}

/* stage layers (video colours, independent of page theme) */
#bg,#imgs,#view3d,#flash{position:absolute;inset:0}
#view3d{background:#000}
#view3d canvas{position:absolute;left:0;top:0;width:360px;height:640px;display:block}
#glow{mix-blend-mode:screen;opacity:.32}
.shotimg{position:absolute;display:block;height:auto;max-width:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 85% at 50% 52%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%)}
#grain{position:absolute;left:0;top:0;width:360px;height:640px;mix-blend-mode:soft-light;pointer-events:none}
#flash{background:#fff;opacity:0;pointer-events:none}
.svgl{position:absolute;left:0;top:0;width:360px;height:640px;overflow:visible;pointer-events:none}
.svgl path,.svgl line{vector-effect:non-scaling-stroke;fill:none}
#sheet{background:#fff}
#sheet .frm{stroke:#cfcfcf;stroke-width:.55}
#sheet .sec{stroke:#1f1f1f;stroke-width:.8;stroke-linejoin:round}
#sheet .sil{fill:#d8d9db;stroke:none}
#sheet .dim{stroke:#7a7a7a;stroke-width:.45}
#sheet .ext{stroke:#9a9a9a;stroke-width:.4}
#sheet .dimtx{fill:#5a5a5a;font-family:var(--f-display);font-weight:500;letter-spacing:.1em}
.gr .ln{stroke-width:.9;stroke-linecap:round;stroke-linejoin:round}
.gr .ln.thin{stroke-width:.55}
.gr.c-w .ln{stroke:#fff}.gr.c-k .ln{stroke:#1b1b1b}.gr.c-g .ln{stroke:#6f6f6f}
.gr .dot{stroke:none}.gr.c-w .dot{fill:#fff}.gr.c-k .dot{fill:#1b1b1b}
.gr .ring{fill:none;stroke-width:.45}.gr.c-w .ring{stroke:#fff}.gr.c-k .ring{stroke:#1b1b1b}
.gr .lbl{font-family:var(--f-display);font-size:7.8px;letter-spacing:.08em}
.gr.c-w .lbl,.gr.c-w .tagl{fill:#fff}.gr.c-k .lbl{fill:#1b1b1b}
.gr .tagl{font-family:var(--f-display);font-size:6.4px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
#txt{position:absolute;inset:0;pointer-events:none}
.tx{position:absolute;white-space:nowrap}
.tx span{display:block;opacity:0;will-change:transform,opacity}
.tx.cap{font-size:14px;font-weight:400;letter-spacing:.27em;line-height:1.36;text-transform:uppercase}
.tx.small{font-size:9.6px;letter-spacing:.16em;line-height:1.6}
.tx.top{font-size:9.8px;letter-spacing:.12em;line-height:1.6}
.tx.top span{display:inline-block;margin-right:.42em}
.tx.hook{transform:translateX(-50%);text-align:center;font-size:17px;font-weight:500;letter-spacing:.28em;line-height:1.45;text-transform:uppercase}
.tx.hook span{transform-origin:50% 60%}
.tx.tag{font-size:6.6px;font-weight:500;letter-spacing:.22em;text-transform:uppercase}
.tx.word{transform:translateX(-50%);text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.42em}
.tx.sub{transform:translateX(-50%);text-align:center;font-size:7.4px;letter-spacing:.16em}
.c-w{color:#fff}.c-k{color:#151515}.c-g{color:#bdbdbd}.c-g2{color:#868686}
.tc{position:absolute;left:8px;top:6px;font-family:var(--f-mono);font-size:7px;color:rgba(255,200,0,.85);pointer-events:none}
.full .tc{display:none}
</style>

<div class="wrap" id="wrap">
  <div class="player">
    <div class="screen" id="screen">
      <div class="stage" id="stage">
        <div id="bg"></div>
        <div id="view3d"><canvas id="gl"></canvas><canvas id="glow"></canvas></div>
        <div id="imgs"></div>
        <svg class="svgl" id="sheet" viewBox="0 0 360 640" aria-hidden="true">
          <g id="frameLines"><line class="frm" x1="22" y1="34" x2="22" y2="606" pathLength="1"/><line class="frm" x1="338" y1="34" x2="338" y2="606" pathLength="1"/></g>
          <g id="dwg"><path class="sil" id="sil" fill-rule="evenodd" d=""/><g id="secLines">
{{SECTION_PATHS}}
          </g><g id="sdims"></g></g>
        </svg>
        <div id="vig"></div>
        <canvas id="grain"></canvas>
        <svg class="svgl" id="ovl" viewBox="0 0 360 640" aria-hidden="true"></svg>
        <div id="txt" aria-hidden="true"></div>
        <div id="flash"></div>
        <div class="tc" id="tc"></div>
      </div>
    </div>
    <div class="ctrl">
      <button type="button" id="play">Пауза</button>
      <button type="button" id="snd" aria-pressed="false">Звук выкл</button>
      <input type="range" id="scrub" min="0" max="9000" step="1" value="0" aria-label="Позиция на таймлайне">
      <span class="mono" id="time">0,00 с</span>
    </div>
    <audio id="sfx" src="assets/audio/intro_v3_mix.mp3" preload="none"></audio>
  </div>
  <div class="side">
    <h1>THERMINAL · Intro v3</h1>
    <p>Рабочий прототип монтажа v3: 11 планов за 9 с, склейки, графика и звук по одному таймлайну. Тот же код рендерит MP4 1080×1920.</p>
  </div>
</div>
